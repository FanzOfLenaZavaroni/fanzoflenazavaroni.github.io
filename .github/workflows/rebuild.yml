name: Manual Site Rebuild

on:
  workflow_dispatch:

# This block grants the action explicit permission to trigger the built-in builder
permissions:
  pages: write
  contents: read

jobs:
  trigger-builtin-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request Native GitHub Rebuild
        run: |
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
