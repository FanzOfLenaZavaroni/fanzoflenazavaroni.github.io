name: Manually Rebuild Site

on:
  push:
    branches: ["main"]      # Keeps your normal automatic builds on push
  workflow_dispatch:        # Adds the permanent manual "Run workflow" button to the UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # Change this to '_site' or 'docs' if your site files live in a subfolder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
