name: Delete all workflow runs

on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: "0 19 * * 0"    # every Sunday at 20:00

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
