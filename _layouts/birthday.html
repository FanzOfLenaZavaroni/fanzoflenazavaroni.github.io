<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  {%- include google-analytics.html -%}

<body>

<article>
  <header class="post-header">
    <h1 class="center-text custom-spacing timed-link">
      <a href="/onthisday/11/11-04+comments">Link to the standard <span class="break-line">"On This Day" <span class="break-line">page for the 4 November</span></a>
    </h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
</body>
</html>

<style>
.center-text { text-align: center; }
.custom-spacing { margin-top: 50px; }

/* Keeps the link invisible for 3 seconds, then brings it into view without shifting layout */
.timed-link { animation: revealLink 0s 3s both; }

@keyframes revealLink {
  0% { opacity: 0; visibility: hidden; }
  100% { opacity: 1; visibility: visible; }
}

@media screen and (orientation: portrait) {
  .center-text { font-size: 24px !important; }
  .break-line { display: block; margin-top: 0; }
}
</style>
